<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a35"><title>AFL Team Guess</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header><div class="badge">🏉 AFL TEAM GUESS</div><h1>AFL Team Guess</h1><p>Name every player on the 2026 list.</p></header>
<section class="picker"><label>Team</label><select id="team"></select></section>
<section class="stats"><div><b id="found">0</b><span>Found</span></div><div><b id="total">0</b><span>Target</span></div><div><b id="pct">0%</b><span>Complete</span></div></section><div class="bar"><div id="bar"></div></div>
<section class="card"><label for="input">Guess a player</label><div class="row"><input id="input" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="Start typing a name..."><button id="guess">GUESS</button></div><div id="suggestions"></div><div id="msg"></div></section>
<section id="cats" class="cats"></section><section class="card"><div class="head"><h2 id="heading"></h2><button id="reveal">Reveal Answers</button></div><div id="players" class="grid"></div></section>
<footer><button id="new">NEW GAME</button><p>Fan-made AFL guessing game</p></footer></main><script src="data.js"></script><script src="game.js"></script></body></html>
